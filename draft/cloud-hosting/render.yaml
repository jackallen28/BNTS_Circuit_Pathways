# Render Blueprint: Circuit Pathways, FREE version. No payment needed (if Render still asks for a card
# for a Blueprint, create a plain Web Service instead: see docs/deploy-render.md "Free hosting").
# It has everything except "Upload to a real board" (that needs the Arduino compilers, which need a
# paid plan: use render.paid.yaml for that). A free service sleeps after 15 minutes without visitors and
# takes about a minute to wake up, so open the site a few minutes before a class.
services:
  - type: web
    name: circuit-pathways
    runtime: docker
    dockerfilePath: ./Dockerfile.free
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Signs class codes and teacher sign-ins. Made once; never share or change it
      # (changing it stops every class code that is already out working).
      - key: CLASS_SECRET
        generateValue: true
      # One or more teacher codes, separated by commas, each at least 8 characters.
      - key: TEACHER_CODES
        sync: false
      # Signs the keys of your Raspberry Pis. Keep the same value for as long as Pis use their keys.
      - key: PI_KEY_SECRET
        sync: false
      # Optional: IDs of Pi keys to switch off (lost or stolen Pis), separated by commas.
      - key: REVOKED_PI_IDS
        sync: false
