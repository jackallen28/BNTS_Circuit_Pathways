name: CI (the website, the Worker, the Pi app)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Go formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: Go tests (server, class codes, Pi relay, content)
        run: go test -race ./...
      - name: PiPath's lesson data is up to date with its TOML
        run: python3 tools/build_pipath_data.py --check
      - name: Pi Link app tests (no Pi needed)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover raspberry-pi
      - run: npm ci
      - name: JavaScript tests (ArduinoPath simulator, wizard, saves, upload; PiPath in real Pyodide)
        run: npm test
      - run: npm ci --prefix cloudflare
      - name: Cloudflare Worker tests (classes, synced work, Pi relay; local Worker and D1)
        run: npm test --prefix cloudflare
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (the whole site, with pretend boards and a pretend Pi)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore

  # The real compilers, for every board: every board's upload file comes out
  # right, and a broken sketch comes back with a line number.
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ~/circuitpathways-tools
          key: tools-${{ hashFiles('internal/arduino/requirements.json') }}
      - run: go run ./cmd/launch -setup -warm -tools "$HOME/circuitpathways-tools"
      - run: go test -count=1 -timeout 60m -run TestCompileEveryBoardForReal -v ./internal/arduino
        env:
          CIRCUITPATHWAYS_TOOLS: /home/runner/circuitpathways-tools

  # The image Render builds, built here first so a broken Dockerfile shows up before a deploy.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: circuitpathways:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts, answers, and has the compilers
        run: |
          docker run -d --name cp -p 8080:8080 -e CLASS_SECRET=0123456789abcdef0123 -e TEACHER_CODES=test-teacher-code -e PI_KEY_SECRET=0123456789abcdef0123 circuitpathways:test
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz
          docker exec cp ls /opt/circuitpathways/bin/arduino-cli
          docker logs cp 2>&1 | tail -5
