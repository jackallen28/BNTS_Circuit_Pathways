name: CI (the school server, student Pis, the website)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The runners are pinned to Ubuntu 24.04 on purpose: "ubuntu-latest" moved to 26.04, which the pinned Playwright
# can't install a browser on, so the browser tests silently stopped running.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Go formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: Go tests (server, classes, set work, student Pis, certificates, Pi relay, content)
        run: go test -race ./...
      - name: PiPath's lesson data is up to date with its TOML
        run: python3 tools/build_pipath_data.py --check
      - name: Pi Link app tests (no Pi needed)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover raspberry-pi
      - run: npm ci
      - name: JavaScript tests (ArduinoPath simulator, wizard, saves, upload; PiPath in real Pyodide)
        run: npm test
      - name: The school server and a student Pi, for real (https, the student Pi installer, Pi Link, offline)
        run: bash tests/pi-server/smoke.sh
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (the whole site, classes and set work, a student Pi, pretend boards and a pretend Pi)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # a full artifact quota must not turn passing tests red
        with:
          name: screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
          retention-days: 3

  # The real compilers, for every board: every board's upload file comes out
  # right, a broken sketch comes back with a line number, and every Web Page Designer sketch compiles.
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # No tools cache: restoring the 1.5 GB cache killed the runner mid-restore (no log, twice in three runs).
      # Downloading fresh takes about four minutes and has been reliable.
      - name: Free some disk space (the compilers are big)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - run: go run ./cmd/circuitpathways -setup -warm -tools "$HOME/circuitpathways-tools"
      - run: go test -count=1 -timeout 60m -run TestCompileEveryBoardForReal -v ./internal/arduino
        env:
          CIRCUITPATHWAYS_TOOLS: /home/runner/circuitpathways-tools
      - name: A real compile through the school server (https) and through a student Pi
        run: TOOLS="$HOME/circuitpathways-tools" bash tests/pi-server/smoke.sh

  # The download for Raspberry Pi: the program for 64-bit Raspberry Pi OS (and a PC copy), and the installer.
  pi-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the Raspberry Pi download
        run: ARCHES="arm64 amd64" bash tools/build-pi.sh
      - name: The Pi program is a 64-bit ARM program, and the installers are valid bash
        run: |
          file dist/circuitpathways-pi/circuitpathways-linux-arm64 | grep -q "ARM aarch64"
          bash -n dist/circuitpathways-pi/install-server.sh
      - name: The PC copy from the download runs the whole smoke test
        run: bash tests/pi-server/smoke.sh dist/circuitpathways-pi/circuitpathways-linux-amd64
