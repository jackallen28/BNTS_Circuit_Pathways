  <title id="title">Dobot Studio tic-tac-toe tokens to cut out</title>
  <desc id="description">Fifteen crosses and fifteen noughts, each a 25 millimetre disc with a black mark.</desc>
  <g id="heading" fill="#17283b">
    <text x="15" y="18" font-size="6" font-weight="bold">Dobot Studio tic-tac-toe tokens</text>
    <text x="15" y="26" font-size="3.4">Print at 100% (not Fit) on matte white paper or card. Each token is 25 mm across.</text>
    <text x="15" y="32" font-size="3.4">Cut along the grey circles. For a firmer token, glue the sheet to 3 mm foam board first.</text>
    <text x="15" y="38" font-size="3.4">Keep the black marks sharp: no gloss, no colour, no pencil.</text>
  </g>
