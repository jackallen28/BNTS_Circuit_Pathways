# ------------------------------------------------------------------ STEP 2
[[steps]]
title = "Open the lid"
support = "scaffolded"
starter_mode = "replace"
starter = '''
from grove.grove_ultrasonic_ranger import GroveUltrasonicRanger
from gpiozero import AngularServo, LED
from time import sleep

ranger = GroveUltrasonicRanger(18)
lid = AngularServo(12, min_angle=0, max_angle=180)
light = LED(5)
lid.angle = 0

def open_lid():
    lid.angle = 90
    light.on()
    print("open")
    sleep(3)
    lid.angle = 0
    light.off()
    print("closed")

for i in range(30):
    if ranger.get_distance() < ___:
        open_lid()
    sleep(0.2)
'''
text = """
`open_lid()` is a **function**: it opens the lid, turns the light on, waits 3 seconds, then closes it. The loop checks the distance again and again.

**Your task:** fill in the blank with how close counts as "a hand" (15 cm works well), then run it and bring your hand close.
"""
hints = [
  "A hand over a bin is closer than about 15 cm.",
  "`if ranger.get_distance() < 15:`",
]
success = "A hands-free bin. Real ones work just like this."
demo = '''
from grove.grove_ultrasonic_ranger import GroveUltrasonicRanger
from gpiozero import AngularServo, LED
from time import sleep

ranger = GroveUltrasonicRanger(18)
lid = AngularServo(12, min_angle=0, max_angle=180)
light = LED(5)
lid.angle = 0

def open_lid():
    lid.angle = 90
    light.on()
    print("open")
    sleep(3)
    lid.angle = 0
    light.off()
    print("closed")

for i in range(30):
    if ranger.get_distance() < 15:
        open_lid()
    sleep(0.2)
'''
demo_events = ["1 distance 18 10", "1.5 distance 18 80"]

