# Render Blueprint: the Circuit Pathways TEST version, for colleagues to try. Free plan, no payment.
# It is the same site and home page with PiPath and ArduinoPath, labelled TEST, with no class codes,
# no teacher page, no Raspberry Pi linking and nothing saved (closing or reloading a tab clears it).
# Upload to a real board is off (that needs the compilers: see render.paid.yaml).
# Use it by choosing this file as the Blueprint path when you create the service in Render.
# It can run beside the real site: it has its own name and its own address.
services:
  - type: web
    name: circuit-pathways-test
    runtime: docker
    rootDir: launch
    dockerfilePath: ./Dockerfile.free
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: BETA
        value: "1"
      # Needed by the server but not used by the TEST version (nobody signs in).
      - key: CLASS_SECRET
        generateValue: true
